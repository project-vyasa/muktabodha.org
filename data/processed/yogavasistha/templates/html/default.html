<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yogavasistha</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif', serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            line-height: 1.6;
            color: #333;
            background-color: #fdfdfd;
        }

        /* Generic Vyasa Semantic Classes */
        .devanagari {
            font-size: 1.25rem;
            text-align: center;
            color: #b22222; /* Indian red */
            margin: 1.5rem 0;
            line-height: 1.8;
        }

        .iast {
            font-size: 1.1rem;
            text-align: center;
            font-style: italic;
            margin: 1.5rem 0;
        }

        .verse {
            font-size: 1.1rem;
            text-align: center;
            margin: 1.5rem 0;
            line-height: 1.8;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <div class="content">
        {{ body }}
    </div>
</body>

</html>
